<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şifremi Unuttum | İPC</title>
{% include "_favicon.html" %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/auth.css') }}" rel="stylesheet">
</head>
<body class="auth">
<div class="giris-perde" aria-hidden="true"></div>
<div class="card login-card shadow-lg m-3">
  <div class="card-body p-4">
    <h5 class="fw-bold mb-1"><i class="bi bi-envelope-exclamation me-1"></i>Şifremi Unuttum</h5>
    <p class="text-secondary small">E-posta adresinizi girin, şifre sıfırlama bağlantısı gönderilecektir.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2 small" style="word-break:break-all">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">E-posta</label>
        <input type="email" name="email" class="form-control" required placeholder="kullanici@example.com">
      </div>
      <button class="btn w-100 text-white fw-semibold" style="background:#8C1D2F">
        <i class="bi bi-send me-1"></i>Sıfırlama Bağlantısı Gönder</button>
    </form>
    <div class="text-center mt-3"><a href="{{ url_for('login') }}" class="small">← Giriş sayfasına dön</a></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
