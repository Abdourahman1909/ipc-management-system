<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yeni Şifre | İPC</title>
{% include "_favicon.html" %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/auth.css') }}" rel="stylesheet">
</head>
<body class="auth">
<div class="giris-perde" aria-hidden="true"></div>
<div class="card login-card shadow-lg m-3">
  <div class="card-body p-4">
    <h5 class="fw-bold mb-3"><i class="bi bi-shield-lock me-1"></i>Yeni Şifre Belirle</h5>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold" for="reset-password">Yeni Şifre (en az 6 karakter)</label>
        <div class="auth-input">
          <span class="auth-input-icon"><i class="bi bi-lock" aria-hidden="true"></i></span>
          <input id="reset-password" type="password" name="password"
                 autocomplete="new-password" required minlength="6">
          <button type="button" class="password-toggle" data-password-toggle
                  aria-controls="reset-password" aria-pressed="false"
                  aria-label="Şifreyi göster" title="Şifreyi göster">
            <i class="bi bi-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" for="reset-password-confirmation">Yeni Şifre (Tekrar)</label>
        <div class="auth-input">
          <span class="auth-input-icon"><i class="bi bi-lock-check" aria-hidden="true"></i></span>
          <input id="reset-password-confirmation" type="password" name="password2"
                 autocomplete="new-password" required minlength="6">
          <button type="button" class="password-toggle" data-password-toggle
                  aria-controls="reset-password-confirmation" aria-pressed="false"
                  aria-label="Şifreyi göster" title="Şifreyi göster">
            <i class="bi bi-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <button class="btn w-100 text-white fw-semibold" style="background:#8C1D2F">Şifreyi Güncelle</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
